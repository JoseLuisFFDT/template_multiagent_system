[project]
name = "template-multiagent-system"
version = "0.1.0"
description = "Educational multi-agent template built on LangGraph: states, router, tools, MCP, subgraphs, human-in-the-loop."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.10",
    "langchain>=1.3.14",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.1.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.2.2",
    "pydantic>=2.13",
    "pyyaml>=6.0",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "streamlit>=1.67.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

[tool.uv]
link-mode = "copy"       # OneDrive cannot hardlink uv's cache files
package = false          # this is an application template, not an installable library

[tool.pytest.ini_options]
pythonpath = ["."]       # lets tests do `from src...` just like the app code does
testpaths = ["tests"]
