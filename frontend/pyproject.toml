[project]
name = "multiagent-frontend"
version = "0.1.0"
description = "Streamlit chat UI for the multi-agent backend. It only talks to the backend over HTTP."
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.67.0",
    "requests>=2.34.2",
]

[tool.uv]
link-mode = "copy"       # OneDrive cannot hardlink uv's cache files
package = false          # this is an application, not an installable library
